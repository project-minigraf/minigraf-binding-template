[package]
name = "minigraf-binding-example"
version = "0.0.0"
edition = "2024"
publish = false
description = "Template for building a new Minigraf language binding"
license = "MIT OR Apache-2.0"

[lib]
name = "minigraf_ffi"
crate-type = ["cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi_bindgen.rs"

[dependencies]
# Unreleased v3 core (format v8). At the v3.0.0 release this goes back to an exact
# crates.io pin (minigraf = "=3.0.0"), which a binding's release workflow updates.
minigraf = { git = "https://github.com/project-minigraf/minigraf", rev = "97cd4a2a85301ea3478250dd654139d45a1f7cd0" }
uniffi = { version = "0.31.1", features = ["cli"] }
thiserror = "2.0.18"
serde_json = "1.0.149"

[workspace]
members = ["."]
